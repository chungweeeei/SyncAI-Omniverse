scene_mode: "warehouse_with_robot"

stl:
  file_path: "/workspace/assets/models/dp1f/dp1f.stl"
  scale: 0.1
  center_xy: true
  ground_plane_size: [20.0, 30.0]

robots:
  # Each entry spawns one MiR250 under /World/<robot_name> with its own
  # ROS2 namespace. run_sim.py loops over this list at startup and attaches
  # per-robot tf/odom/cmd_vel/lidar bridges with namespaced OmniGraph paths
  # (e.g. /robot01/CmdVelActionGraph). Clock is shared across robots.
  #
  # Per-entry keys:
  #   enabled          : bool. Skip if false.
  #   model            : "mir250" (only model supported today).
  #   robot_name       : USD prim name (must be unique per stage).
  #   namespace        : ROS2 namespace (e.g. "robot01"). Drives topic prefix
  #                      and per-robot OmniGraph paths.
  #   spawn_position   : [x, y, z]. z must equal 0.20 * scale so wheels
  #                      touch ground (chassis floats otherwise).
  #   scale            : uniform robot size multiplier (1.0 = real MiR250).
  #                      Linear dims x scale, default mass x scale^3, default
  #                      inertias x scale^5. Wheel radius / track width are
  #                      auto-derived in run_sim.py from this scale.
  #   lidar_layout     : "dual_diagonal" (two RTX lidars publishing
  #                      <ns>/scan_front + <ns>/scan_rear) or "single_center".
  #   mass (optional)  : Override base_link mass. If omitted, scale^3 default
  #                      keeps chassis:wheel ratio near 50:1 (PhysX stable).
  - enabled: true
    model: "mir250"
    robot_name: "MirAMR_01"
    namespace: "robot01"
    spawn_position: [0.0, 0.0, 0.14]
    scale: 0.7
    lidar_layout: "dual_diagonal"
  - enabled: true
    model: "mir250"
    robot_name: "MirAMR_02"
    namespace: "robot02"
    spawn_position: [0.0, 5.0, 0.14]
    scale: 0.7
    lidar_layout: "dual_diagonal"

doors:
  # Automatic sliding doors. Each entry becomes kinematic leaves under
  # /World/Doors/<name>. The ROS2 bridge (attached at runtime by
  # run_sim.py) subscribes to /door/<id>/cmd_topic (std_msgs/Bool) to
  # command open (true) / closed (false), and publishes the state
  # machine on /door/<id>/state (std_msgs/String, one of
  # closed / opening / open / closing).
  - name: "EastDoor"                # USD prim name under /World/Doors/
    id: "door_01"                   # drives /door/door_01/{cmd_topic,state}
    position: [8.35, 5.06, 0.0]     # centre of opening at floor; tune in usdview
    rotation_z_deg: 0.0             # 0 = leaves slide along world Y
    opening_width: 3.0
    opening_height: 2.0
    leaf_thickness: 0.05
    leaf_mass: 25.0
    # open_target omitted -> auto = opening_width/2 - 0.05 = 1.2 m per leaf
    # cmd_topic / state_topic optional; default from id

charging_stations:
  # Static MiR250-style rear-docking charging dock. Pure scene prop with a
  # collidable enclosure + faceplate plus a small floor docking plate. No
  # ROS2, no motion. Each entry becomes /World/ChargingStations/<name>.
  # Robot reverses along the prop's local -X to dock; faceplate (contacts,
  # LED) is on local +X, and the approach pad sits on the floor in front.
  - name: "Charger01"                # USD prim name under /World/ChargingStations/
    id: "charger_01"                 # logical id, stamped on customData
    position: [1.6, 12.5, 0.0]      # world XYZ of dock base centre at floor
    rotation_z_deg: -90.0            # -90 deg yaw (-1.57 rad); faceplate normal points -Y
    # approach_pad: true             # default; set false to omit the floor plate

conveyors:
  # Isaac Sim 5.1 ConveyorBelt assets, referenced from a local copy of
  # NVIDIA's public asset bucket (download with `tools/fetch_isaac_conveyor.py`).
  # Each entry becomes /World/Conveyors/<id> with the asset's defaultPrim
  # subtree composed in via reference. Geometry, materials and colliders
  # come from the Isaac USD; we only own placement + customData.
  #
  # Per-entry keys (see src/syncai_omniverse/usd/conveyor.py for full doc):
  #   id (required)        : prim name + ROS2 topic key
  #   usd_path (required)  : repo-root-relative path to the conveyor USD
  #   position             : [x, y, z] world XYZ; conveyor's local origin
  #                          (Isaac authors the bottom near z=0 -- a small z>0
  #                          lift avoids z-fighting with the warehouse ground).
  #   rotation_z_deg       : yaw in degrees (0 = belt aligned with world +X)
  #   scale                : uniform scale factor (default 1.0)
  #   belt_surface_prim    : (optional) belt mesh prim under the wrapper to
  #                          target with surface velocity at runtime; default
  #                          "<wrapper>/Belt" is a placeholder -- override
  #                          per-variant when wiring belt motion later.
  #   ros2_speed_topic / ros2_status_topic : optional topic overrides
  - name: "Conveyor01"
    id: "conveyor_01"
    usd_path: "assets/usd/conveyors/ConveyorBelt_A08.usd"
    # East-wall loading station: belt runs north-south along world Y.
    # A08 is 2.72 m long x 1.15 m wide; with rot=90 the belt occupies
    # world X=[5.93, 7.08], Y=[-5.72, -3.00] -- ~1.2 m from the +X wall,
    # ~8 m from EastDoor, clear of both robots' spawn area.
    position: [-2.0, 10.0, 0.05]
    rotation_z_deg: 90.0
    scale: 1.0
    # ConveyorBelt_A08's belt mesh is SM_ConveyorBelt_A08_02 (the prim name
    # varies per Isaac variant). Pinned here so the runtime IsaacConveyor
    # node knows which surface to drive when belt motion is wired up.
    belt_surface_prim: "/World/Conveyors/conveyor_01/SM_ConveyorBelt_A08_02"

    # Cargo box spawned at runtime by run_sim.py (DynamicCuboid). With the
    # conveyor at position [-2, 10] rotated 90 deg, the belt occupies world
    # X=[-2.58, -1.42], Y=[7.28, 10.00], Z=[0.05, 1.22]. Spawn just past the
    # head end (Y=7.28) and ~0.2 m above the belt top.
    test_box:
      enabled: true
      size: 0.3
      mass: 5.0
      position: [-2.0, 7.5, 1.45]

    # Limit switch implemented as a soft gate inside the runtime ScriptNode:
    # while box.world_pos[axis] >= threshold, effective conveyor speed is
    # pinned to 0 and the status topic publishes "limit_triggered". When the
    # box moves back below the threshold the commanded speed resumes.
    # Threshold below = 0.3 m short of the tail (Y_max=10.0).
    limit_switch:
      enabled: true
      axis: "y"
      threshold: 9.7

output:
  scene_path: "scenes/dp1f_mir.usda"
