scene_mode: "warehouse_with_robot"

stl:
  file_path: "/workspace/assets/models/dp1f/dp1f.stl"
  scale: 0.1
  center_xy: true
  ground_plane_size: [20.0, 30.0]

robot:
  enabled: true
  model: "mir250"
  robot_name: "MirAMR"
  # Spawn z=0.20 keeps base_link center 0.20m above ground, so wheel bottom
  # (r=0.10 at local z=-0.10) touches z=0 and chassis bottom sits at z=0.05
  # (the MiR250 ~50mm ground clearance).
  spawn_position: [0.0, 0.0, 0.20]
  # 100 kg approximates MiR250 empty weight (~97 kg). Raise for payload
  # scenarios; drive gains in run_sim.py (damping=800, maxForce=40) are
  # tuned for this mass and will need adjustment if it changes substantially.
  mass: 100.0
  lidar_layout: "dual_diagonal"

output:
  scene_path: "scenes/dp1f_mir250.usda"
