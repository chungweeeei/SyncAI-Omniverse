[project]
name = "syncai-omniverse"
version = "0.1.0"
description = "Warehouse simulation with TurtleBot3 AMR on NVIDIA Isaac Sim 5.1"
requires-python = ">=3.10"

# Note: isaacsim, pxr, omni, carb are provided by the Isaac Sim runtime.
# For local USD-only work (stl_to_usd, preview), install: pip install usd-core
dependencies = [
    "pyyaml",
    "usd-core",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
