services:
  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:5.1.0
    container_name: syncai-simulation
    entrypoint: bash
    stdin_open: true
    tty: true
    networks:
      - syncai-network
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      OMNI_KIT_ACCEPT_EULA: "YES"
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      XAUTHORITY: /tmp/.Xauthority
      # ROS2 / CycloneDDS — Isaac Sim ships its own ROS2 Jazzy under
      # /isaac-sim/exts/isaacsim.ros2.bridge/jazzy/lib; put it on LD_LIBRARY_PATH so
      # the bridge extension can dlopen rmw + ament libs.
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: /workspace/config/cyclonedds.xml
      ROS_DISTRO: jazzy
      LD_LIBRARY_PATH: /isaac-sim/exts/isaacsim.ros2.bridge/jazzy/lib
    volumes:
      # X11 passthrough for usdview / Kit UI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:rw
      # Project source / assets / scenes
      - ./:/workspace:rw
      # Isaac Sim caches — bind mounts under ./.isaac-cache so the container UID (1234)
      # can write to them. Named volumes inherit root-ownership from the image and break
      # the RTX shader cache / ogn_generated / material_cache. Paths mirror HOME=/isaac-sim.
      - ./.isaac-cache/kit:/isaac-sim/kit/cache:rw
      # Mount the whole /isaac-sim/.cache so subdirs Isaac Sim creates on demand
      # (warp, ov, pip, nvidia/GLCache, …) all land on a writable bind.
      - ./.isaac-cache/cache:/isaac-sim/.cache:rw
      - ./.isaac-cache/compute:/isaac-sim/.nv/ComputeCache:rw
      - ./.isaac-cache/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ./.isaac-cache/data:/isaac-sim/.local/share/ov/data:rw
      - ./.isaac-cache/documents:/isaac-sim/Documents:rw
    working_dir: /workspace

networks:
  syncai-network:
    external: true
    name: syncai-network
