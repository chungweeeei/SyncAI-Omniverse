services:
  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:5.1.0
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - ACCEPT_EULA=Y
      # Vulkan ICD (NVIDIA GPU rendering)
      - VK_ICD_FILENAMES=/etc/vulkan/icd.d/nvidia_icd.json
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # ROS2 DDS communication
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    container_name: isaac-sim
    entrypoint: bash
    command: >-
      -c "./isaac-sim.sh --exec /startup/startup_scene.py"
    volumes:
      # X11 socket (for headless virtual display)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # GPU device nodes
      - /dev/dri:/dev/dri
      # Persistent cache & data (avoid re-downloading shaders each run)
      - isaac-sim-cache-kit:/isaac-sim/kit/cache
      - isaac-sim-cache-ov:/home/ubuntu/.cache/ov
      - isaac-sim-cache-pip:/home/ubuntu/.cache/pip
      - isaac-sim-cache-glcache:/home/ubuntu/.cache/nvidia/GLCache
      - isaac-sim-cache-computecache:/home/ubuntu/.nv/ComputeCache
      - isaac-sim-logs:/home/ubuntu/.nvidia-omniverse/logs
      - isaac-sim-data:/home/ubuntu/.local/share/ov/data
      - isaac-sim-documents:/home/ubuntu/Documents
      # Project files
      - ./startup_scene.py:/startup/startup_scene.py:ro
      - ./src:/workspace/src:ro
      - ./config:/workspace/config:ro
      # Building floor plan STL
      - ./models/dp1f:/workspace/models/dp1f:ro
    network_mode: host
    ipc: host
    shm_size: '4gb'
    privileged: true
    stdin_open: true
    tty: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics, display]

volumes:
  isaac-sim-cache-kit:
  isaac-sim-cache-ov:
  isaac-sim-cache-pip:
  isaac-sim-cache-glcache:
  isaac-sim-cache-computecache:
  isaac-sim-logs:
  isaac-sim-data:
  isaac-sim-documents: